<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Astralium product cover template — emerald and gold">
  <!-- Product cover template · EMERALD & GOLD duotone.
       Replace {{CATEGORY}} and {{TITLE}}; keep the gilt frame. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b6e4f"/>
      <stop offset="0.56" stop-color="#123c2a"/>
      <stop offset="1" stop-color="#081a11"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="150" cy="110" r="1.8" fill="#ffffff" opacity="0.5"/>
  <circle cx="610" cy="80" r="1.3" fill="#ffffff" opacity="0.45"/>
  <circle cx="700" cy="240" r="1.6" fill="#ffffff" opacity="0.5"/>
  <circle cx="330" cy="150" r="1.1" fill="#ffffff" opacity="0.4"/>
  <rect x="18" y="18" width="764" height="564" fill="none" stroke="#e3c878" stroke-opacity="0.6"/>
  <text x="730" y="86" font-size="44" fill="#e3c878" text-anchor="end">✦</text>
  <text x="52" y="470" font-family="Arial, sans-serif" font-size="19" letter-spacing="5" fill="#e3c878">{{CATEGORY}}</text>
  <rect x="54" y="492" width="68" height="2" fill="#e3c878"/>
  <text x="52" y="545" font-family="'Playfair Display', 'Amiri', Georgia, serif" font-size="46" fill="#f3ecda">{{TITLE}}</text>
</svg>
